#
# Android arm64 APK prototype for Chata (target: Retroid Pocket Duo, Snapdragon Q-7790).
#
# A NEW file derived from the android job that upstream's release-binaries.yml carried in #360
# before it was reverted. Manual runs only; the APK is uploaded as a workflow artifact. It is signed
# with the repository's debug keystore, so it is for sideloading and testing only.

name: chata-android

on:
  workflow_dispatch:
  # Temporary: lets the prototype build run from its branch before the workflow reaches nx2.
  push:
    branches: [chata/android-apk]
    paths: ['.github/workflows/chata-android.yml']

permissions:
  contents: read

jobs:
  android:
    name: android-arm64 apk
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1500M
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools ccache
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.5" > /dev/null

      - name: Cache CPM downloads
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-android-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-android-

      - name: Cache compiler objects
        uses: actions/cache@v5
        with:
          path: .ccache
          key: objects-android-arm64-${{ github.sha }}
          restore-keys: |
            objects-android-arm64-

      - name: Build APK
        shell: bash
        working-directory: src/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon "-PYUZU_ANDROID_ARGS=-DUSE_CCACHE=ON" assembleMainlineRelease
          apk=$(find app/build/outputs/apk/mainline/release -name '*.apk' | head -1)
          test -n "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/chata-android-arm64-${GITHUB_SHA::10}.apk"
          ccache --show-stats || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: chata-android-arm64-${{ github.sha }}
          path: chata-android-arm64-*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
